<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Cái Xuân Hòa — AI Engineer</title>
  <desc id="desc">A compact animated AI operations console with moving signals and softly pulsing nodes.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.58" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#120B25"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#FF4D8D"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.24" stop-color="#00D9FF" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7C3AED" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="10" y="10" width="1180" height="240" rx="20"/></clipPath>
  </defs>

  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
  <rect x="10" y="10" width="1180" height="240" rx="20" fill="url(#grid)" stroke="url(#neon)" stroke-width="1.2" stroke-opacity="0.58"/>

  <g clip-path="url(#frame)">
    <rect x="0" y="-45" width="1200" height="42" fill="url(#neon)" opacity="0.045">
      <animate attributeName="y" values="-45;270" dur="6s" repeatCount="indefinite"/>
    </rect>
    <path d="M0 218C180 180 315 242 500 207S850 173 1200 219" fill="none" stroke="#00D9FF" stroke-opacity="0.13" stroke-width="1.5" stroke-dasharray="7 12">
      <animate attributeName="stroke-dashoffset" values="0;-190" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="60" cy="49" r="5" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="76" y="55" fill="#8B949E" font-size="14" letter-spacing="2">CÁI XUÂN HÒA</text>

    <text x="58" y="132" fill="#F0F6FC" font-size="58" font-weight="750" letter-spacing="-2">AI ENGINEER</text>
    <text x="61" y="177" fill="url(#neon)" font-size="18" font-weight="600" letter-spacing="2">LEARNING  AIOPS · CLOUD · LLMOPS</text>
    <text x="61" y="215" fill="#6E7681" font-size="13">curious mind / practical systems / one step at a time</text>
    <rect x="504" y="203" width="8" height="14" rx="1" fill="#FF4D8D">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(985 130)">
    <circle r="91" fill="none" stroke="#7C3AED" stroke-opacity="0.14" stroke-dasharray="4 11">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
    </circle>
    <circle r="65" fill="none" stroke="#00D9FF" stroke-opacity="0.20" stroke-dasharray="3 9">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
    </circle>

    <g fill="none" stroke="url(#neon)" stroke-width="1.6" stroke-opacity="0.58" stroke-dasharray="5 7">
      <path d="M0 0L-71-39L-50 59L36 73L74 17L48-55Z">
        <animate attributeName="stroke-dashoffset" values="0;-72" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M-71-39L48-55M-50 59L74 17M36 73L0 0" opacity="0.5"/>
    </g>

    <circle r="35" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="31;37;31" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="17" fill="#0D1117" stroke="#00D9FF" stroke-width="1.5"/>
    <path d="M-7 1L-2 6L8-7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#glow)">
      <circle cx="-71" cy="-39" r="6" fill="#00D9FF"><animate attributeName="r" values="5;8;5" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="-50" cy="59" r="6" fill="#7C3AED"><animate attributeName="r" values="6;9;6" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="36" cy="73" r="6" fill="#FF4D8D"><animate attributeName="opacity" values="1;0.35;1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="74" cy="17" r="6" fill="#00D9FF"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="48" cy="-55" r="6" fill="#FF4D8D"><animate attributeName="r" values="5;8;5" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>

    <circle r="3.5" fill="#FFFFFF" filter="url(#glow)">
      <animateMotion dur="3.8s" repeatCount="indefinite" path="M0 0L-71-39L48-55L0 0"/>
    </circle>
  </g>
</svg>
