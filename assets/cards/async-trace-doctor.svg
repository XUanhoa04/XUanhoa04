<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-labelledby="title desc">
  <title id="title">Async Trace Doctor</title>
  <desc id="desc">An evidence-first OpenTelemetry auditor for asynchronous traces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1820"/><stop offset="1" stop-color="#071014"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#06B6D4"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect x="1" y="1" width="578" height="198" rx="16" fill="url(#bg)" stroke="#1C353A"/>
  <path d="M17 1h546a16 16 0 0 1 16 16v1H1v-1A16 16 0 0 1 17 1Z" fill="url(#accent)" opacity=".9"/>
  <circle cx="526" cy="48" r="34" fill="#2DD4BF" opacity=".08" filter="url(#glow)"/>
  <g transform="translate(28 36)" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 22h8l4-12 8 25 6-18 4 5h8"/><circle cx="21" cy="22" r="19" opacity=".35"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="82" y="49" fill="#F8FAFC" font-size="18" font-weight="700">async-trace-doctor</text>
    <text x="82" y="70" fill="#5EEAD4" font-size="12" font-weight="600" letter-spacing=".5">EVIDENCE-FIRST OTEL AUDITOR</text>
    <text x="28" y="108" fill="#9DB9B8" font-size="13.5">Diagnoses retries, fan-out, batching, clock skew, and</text>
    <text x="28" y="129" fill="#9DB9B8" font-size="13.5">topology drift across asynchronous distributed traces.</text>
    <g font-size="11" font-weight="600">
      <rect x="28" y="153" width="44" height="24" rx="12" fill="#102B2B"/><text x="42" y="169" fill="#67E8F9">Go</text>
      <rect x="80" y="153" width="54" height="24" rx="12" fill="#102B2B"/><text x="94" y="169" fill="#5EEAD4">OTel</text>
      <rect x="142" y="153" width="48" height="24" rx="12" fill="#102B2B"/><text x="155" y="169" fill="#A7F3D0">CLI</text>
    </g>
    <text x="525" y="169" fill="#52716F" font-size="12">↗ open</text>
  </g>
</svg>
