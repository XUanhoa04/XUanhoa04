<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-labelledby="title desc">
  <title id="title">AIOps Demo on Amazon Bedrock</title>
  <desc id="desc">Explainable closed-loop AIOps with risk-gated remediation.</desc>
