<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="term-title term-desc">
  <title id="term-title">Antigravity Terminal HUD — System Diagnostics</title>
  <desc id="term-desc">Cyberpunk terminal card showing developer identity, core abilities, and system specs.</desc>

  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A17"/>
      <stop offset="50%" stop-color="#0B1024"/>
      <stop offset="100%" stop-color="#04060E"/>
    </linearGradient>

    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E162E"/>
      <stop offset="100%" stop-color="#141C38"/>
    </linearGradient>

    <filter id="glow-term" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="term-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.7" fill="#7C3AED" fill-opacity="0.15"/>
    </pattern>

    <style>
      @keyframes blink-cursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulse-live {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .cursor-blink { animation: blink-cursor 0.9s infinite ease-in-out; }
      .live-pulse { animation: pulse-live 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Window Card Shadow -->
  <rect x="5" y="5" width="1190" height="300" rx="16" fill="#000000" fill-opacity="0.5"/>

  <!-- Window Main Background -->
  <rect x="0" y="0" width="1200" height="310" rx="16" fill="url(#term-bg)"/>
  <rect x="0" y="0" width="1200" height="310" rx="16" fill="url(#term-dots)"/>

  <!-- Outer Neon Border Frame -->
  <rect x="1" y="1" width="1198" height="308" rx="15" fill="none" stroke="url(#term-border)" stroke-width="1.4"/>

  <!-- Terminal Title Bar -->
  <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 1184 0 C 1192.84 0 1200 7.16 1200 16 L 1200 42 L 0 42 Z" fill="url(#header-grad)"/>
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Window Action Buttons -->
  <g transform="translate(24, 16)">
    <circle cx="0" cy="5" r="6" fill="#FF5F56"/>
    <circle cx="20" cy="5" r="6" fill="#FFBD2E"/>
    <circle cx="40" cy="5" r="6" fill="#27C93F"/>
  </g>

  <!-- Window Title -->
  <g transform="translate(100, 26)" font-family="'JetBrains Mono', SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#94A3B8">
    <text x="0" y="0">antigravity@quantum-deck: <tspan fill="#38BDF8">~/profile</tspan> <tspan fill="#64748B">--system-diagnostics</tspan></text>
  </g>

  <!-- Top Right Live Status Telemetry -->
  <g transform="translate(860, 16)" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">
    <rect width="100" height="20" rx="4" fill="#0D1F1C" stroke="#00FFA3" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="10" cy="10" r="3" fill="#00FFA3" class="live-pulse"/>
    <text x="20" y="14" fill="#00FFA3" font-weight="700">GPU: 120 FPS</text>

    <g transform="translate(110, 0)">
      <rect width="115" height="20" rx="4" fill="#1A132F" stroke="#A855F7" stroke-opacity="0.5" stroke-width="0.8"/>
      <circle cx="10" cy="10" r="3" fill="#A855F7" class="live-pulse"/>
      <text x="20" y="14" fill="#C084FC" font-weight="700">AGENTIC: ACTIVE</text>
    </g>

    <g transform="translate(235, 0)">
      <rect width="85" height="20" rx="4" fill="#0B1A2E" stroke="#00F0FF" stroke-opacity="0.5" stroke-width="0.8"/>
      <circle cx="10" cy="10" r="3" fill="#00F0FF" class="live-pulse"/>
      <text x="20" y="14" fill="#38BDF8" font-weight="700">LATENCY: 0ms</text>
    </g>
  </g>

  <!-- Terminal Content Body -->
  <g transform="translate(30, 74)" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">
    
    <!-- Line 1: Command prompt -->
    <text x="0" y="0">
      <tspan fill="#00FFA3" font-weight="700">➜ </tspan>
      <tspan fill="#00F0FF" font-weight="600">quantum-deck </tspan>
      <tspan fill="#F8FAFC" font-weight="700">git:(</tspan><tspan fill="#FF007F">main</tspan><tspan fill="#F8FAFC" font-weight="700">)</tspan>
      <tspan fill="#E2E8F0"> antigravity --whoami --capabilities</tspan>
    </text>

    <!-- Line 2: Identity Spec -->
    <text x="0" y="28">
      <tspan fill="#64748B">├── </tspan>
      <tspan fill="#38BDF8" font-weight="600">IDENTIFIER</tspan>
      <tspan fill="#64748B"> : </tspan>
      <tspan fill="#F1F5F9" font-weight="700">Cái Xuân Hòa</tspan>
      <tspan fill="#94A3B8"> (@XUanhoa04)</tspan>
      <tspan fill="#64748B"> [AI Engineer &amp; Frontend Architect]</tspan>
    </text>

    <!-- Line 3: Title / Persona -->
    <text x="0" y="54">
      <tspan fill="#64748B">├── </tspan>
      <tspan fill="#C084FC" font-weight="600">DOMINION  </tspan>
      <tspan fill="#64748B"> : </tspan>
      <tspan fill="#FFD700" font-weight="700">👑 VUA CỦA FRONTEND </tspan>
      <tspan fill="#E2E8F0">· Master of UI/UX Engineering · Creative Canvas &amp; WebGL</tspan>
    </text>

    <!-- Line 4: Superpowers -->
    <text x="0" y="80">
      <tspan fill="#64748B">├── </tspan>
      <tspan fill="#00FFA3" font-weight="600">ENGINE    </tspan>
      <tspan fill="#64748B"> : </tspan>
      <tspan fill="#38BDF8">React 19</tspan><tspan fill="#64748B"> · </tspan>
      <tspan fill="#A855F7">Next.js 15</tspan><tspan fill="#64748B"> · </tspan>
      <tspan fill="#38BDF8">TypeScript</tspan><tspan fill="#64748B"> · </tspan>
      <tspan fill="#38BDF8">Tailwind CSS</tspan><tspan fill="#64748B"> · </tspan>
      <tspan fill="#FF007F">Three.js/WebGL</tspan><tspan fill="#64748B"> · </tspan>
      <tspan fill="#00FFA3">LangGraph &amp; Bedrock</tspan>
    </text>

    <!-- Line 5: Philosophy -->
    <text x="0" y="106">
      <tspan fill="#64748B">├── </tspan>
      <tspan fill="#FF007F" font-weight="600">MISSION   </tspan>
      <tspan fill="#64748B"> : </tspan>
      <tspan fill="#E2E8F0">"Build buttery-smooth, zero-jank, jaw-dropping visual interfaces powered by autonomous intelligence."</tspan>
    </text>

    <!-- Line 6: Focus Area -->
    <text x="0" y="132">
      <tspan fill="#64748B">└── </tspan>
      <tspan fill="#F59E0B" font-weight="600">STATUS    </tspan>
      <tspan fill="#64748B"> : </tspan>
      <tspan fill="#00FFA3">● Hyper-focused</tspan>
      <tspan fill="#94A3B8"> · Open for High-Impact Roles &amp; Cutting-Edge Collaborations</tspan>
    </text>

    <!-- Line 7: Next prompt with blinking cursor -->
    <g transform="translate(0, 168)">
      <text x="0" y="0">
        <tspan fill="#00FFA3" font-weight="700">➜ </tspan>
        <tspan fill="#00F0FF" font-weight="600">quantum-deck </tspan>
        <tspan fill="#F8FAFC" font-weight="700">git:(</tspan><tspan fill="#FF007F">main</tspan><tspan fill="#F8FAFC" font-weight="700">)</tspan>
        <tspan fill="#E2E8F0"> antigravity --deploy --instant</tspan>
      </text>
      <rect x="360" y="-14" width="9" height="18" rx="2" fill="#00F0FF" class="cursor-blink" filter="url(#glow-term)"/>
    </g>

  </g>

</svg>
