<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Cái Xuân Hòa — King of Frontend &amp; Antigravity Architect</title>
  <desc id="banner-desc">Futuristic Antigravity Cyberpunk HUD Banner with glowing neon orbital rings, particle visualizer, and 120 FPS high-tech aesthetics.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060E"/>
      <stop offset="35%" stop-color="#080D1F"/>
      <stop offset="70%" stop-color="#0E0824"/>
      <stop offset="100%" stop-color="#050311"/>
    </linearGradient>

    <!-- Neon Accents Gradient -->
    <linearGradient id="neon-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="30%" stop-color="#7000FF"/>
      <stop offset="70%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>

    <linearGradient id="text-gold-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <radialGradient id="quantum-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#FF007F" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#7C3AED" stroke-opacity="0.09" stroke-width="1"/>
      <circle cx="30" cy="30" r="0.8" fill="#00F0FF" fill-opacity="0.25"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="hyper-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip Paths -->
    <clipPath id="banner-clip">
      <rect x="12" y="12" width="1176" height="296" rx="20"/>
    </clipPath>

    <style>
      @keyframes scanline {
        0% { transform: translateY(-80px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(350px); opacity: 0; }
      }
      @keyframes orbit-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbit-ccw {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulse-core {
        0%, 100% { transform: scale(0.92); opacity: 0.85; }
        50% { transform: scale(1.12); opacity: 1; filter: drop-shadow(0 0 15px #00F0FF); }
      }
      @keyframes dash-flow {
        to { stroke-dashoffset: -100; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.1; }
      }
      @keyframes wave-bar {
        0%, 100% { height: 6px; y: 22px; }
        50% { height: 26px; y: 2px; }
      }
      .anim-scan { animation: scanline 7s linear infinite; }
      .anim-orbit1 { transform-origin: 980px 160px; animation: orbit-cw 28s linear infinite; }
      .anim-orbit2 { transform-origin: 980px 160px; animation: orbit-ccw 20s linear infinite; }
      .anim-orbit3 { transform-origin: 980px 160px; animation: orbit-cw 14s linear infinite; }
      .anim-core { transform-origin: 980px 160px; animation: pulse-core 3.5s ease-in-out infinite; }
      .anim-flow { animation: dash-flow 4s linear infinite; }
      .anim-blink { animation: blink 1.2s ease-in-out infinite; }
      .bar-1 { animation: wave-bar 1.1s ease-in-out infinite 0.1s; }
      .bar-2 { animation: wave-bar 0.9s ease-in-out infinite 0.3s; }
      .bar-3 { animation: wave-bar 1.4s ease-in-out infinite 0.2s; }
      .bar-4 { animation: wave-bar 0.8s ease-in-out infinite 0.5s; }
      .bar-5 { animation: wave-bar 1.2s ease-in-out infinite 0.4s; }
      .bar-6 { animation: wave-bar 1.0s ease-in-out infinite 0.6s; }
    </style>
  </defs>

  <!-- Outer Base Card -->
  <rect width="1200" height="320" rx="24" fill="url(#bg-grad)"/>
  
  <!-- Cyber Grid Background -->
  <rect x="12" y="12" width="1176" height="296" rx="20" fill="url(#cyber-grid)"/>

  <!-- Glowing Border Frame -->
  <rect x="12" y="12" width="1176" height="296" rx="20" fill="none" stroke="url(#neon-cyan-purple)" stroke-width="1.8" stroke-opacity="0.75" filter="url(#soft-glow)"/>

  <!-- Scanning Laser Light Effect -->
  <g clip-path="url(#banner-clip)">
    <g class="anim-scan">
      <rect x="0" y="0" width="1200" height="35" fill="url(#neon-cyan-purple)" opacity="0.06"/>
      <line x1="0" y1="35" x2="1200" y2="35" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.3" filter="url(#soft-glow)"/>
    </g>
    
    <!-- Cyber Geometric Corner Accents -->
    <path d="M 12 50 L 50 12 M 12 60 L 60 12" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1.5"/>
    <path d="M 1188 270 L 1150 308 M 1188 260 L 1140 308" stroke="#FF007F" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Dynamic Flowing Energy Horizon -->
    <path d="M 0 250 C 220 210, 440 280, 700 240 S 1020 200, 1200 245" fill="none" stroke="#7C3AED" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="8 12" class="anim-flow"/>
    <path d="M 0 265 C 280 230, 520 290, 780 255 S 1080 225, 1200 260" fill="none" stroke="#00F0FF" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="5 10" class="anim-flow"/>
  </g>

  <!-- LEFT HUD: Identity & Typography -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Ubuntu, sans-serif">
    
    <!-- Status Pill Badge -->
    <g transform="translate(56, 42)">
      <rect width="360" height="28" rx="14" fill="#0E1629" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#00FFA3" filter="url(#soft-glow)" class="anim-blink"/>
      <text x="32" y="18" fill="#00FFA3" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.5">LIVE</text>
      <text x="68" y="18" fill="#8B949E" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.2">|</text>
      <text x="82" y="18" fill="#00F0FF" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.2">120 FPS</text>
      <text x="145" y="18" fill="#8B949E" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.2">|</text>
      <text x="160" y="18" fill="#E2E8F0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.2">ANTIGRAVITY ENGINE</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(54, 122)">
      <text x="0" y="0" fill="url(#text-gold-cyan)" font-size="52" font-weight="900" letter-spacing="-1.5" filter="url(#soft-glow)">CÁI XUÂN HÒA</text>
    </g>

    <!-- Role Subtitle with Neon Gradient -->
    <g transform="translate(56, 162)">
      <text x="0" y="0" fill="url(#neon-cyan-purple)" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" font-weight="800" letter-spacing="2.8" filter="url(#soft-glow)">
        ⚡ KING OF FRONTEND · CREATIVE AI ARCHITECT
      </text>
    </g>

    <!-- Philosophy Tagline -->
    <g transform="translate(56, 198)" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" fill="#94A3B8">
      <text x="0" y="0">
        <tspan fill="#38BDF8">&gt;</tspan> Defying gravity through code: <tspan fill="#F8FAFC" font-weight="600">Zero Lag</tspan> · <tspan fill="#F8FAFC" font-weight="600">Pixel Perfection</tspan> · <tspan fill="#F8FAFC" font-weight="600">Next-Gen Web Art</tspan>
      </text>
      <text x="0" y="24" fill="#64748B">
        Bridging high-performance frontend interfaces with autonomous AI agent systems.
      </text>
    </g>

    <!-- Mini Audio / Signal Frequency Visualizer in Left Bottom -->
    <g transform="translate(56, 255)">
      <text x="0" y="18" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5">AUDIO SYNC</text>
      <g transform="translate(95, 0)" fill="#00F0FF" opacity="0.85">
        <rect x="0" y="10" width="3.5" height="15" rx="1.5" class="bar-1"/>
        <rect x="7" y="5" width="3.5" height="20" rx="1.5" class="bar-2"/>
        <rect x="14" y="2" width="3.5" height="25" rx="1.5" class="bar-3"/>
        <rect x="21" y="8" width="3.5" height="18" rx="1.5" class="bar-4"/>
        <rect x="28" y="4" width="3.5" height="22" rx="1.5" class="bar-5"/>
        <rect x="35" y="11" width="3.5" height="14" rx="1.5" class="bar-6"/>
        <rect x="42" y="6" width="3.5" height="19" rx="1.5" class="bar-2"/>
        <rect x="49" y="3" width="3.5" height="24" rx="1.5" class="bar-1"/>
      </g>
      
      <!-- Micro Location/Domain Badge -->
      <g transform="translate(175, 2)">
        <rect width="210" height="22" rx="6" fill="#0B132B" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1"/>
        <text x="12" y="15" fill="#C084FC" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1">LOCATION: VIETNAM / GLOBAL</text>
      </g>
    </g>

  </g>

  <!-- RIGHT HUD: 3D Quantum Gyroscopic Antigravity Core -->
  <g transform="translate(980, 160)">
    
    <!-- Outer Holographic Radar Ring -->
    <circle r="122" fill="none" stroke="#7C3AED" stroke-opacity="0.16" stroke-width="1.2" stroke-dasharray="3 8"/>
    <circle r="105" fill="none" stroke="#00F0FF" stroke-opacity="0.22" stroke-width="1.4" stroke-dasharray="6 14" class="anim-orbit1"/>
    <circle r="84" fill="none" stroke="#FF007F" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="10 20" class="anim-orbit2"/>

    <!-- Gyroscopic Elliptical Orbits (Antigravity Rings) -->
    <g class="anim-orbit1">
      <ellipse rx="96" ry="34" fill="none" stroke="url(#neon-cyan-purple)" stroke-width="2" stroke-dasharray="7 9" stroke-opacity="0.8" filter="url(#soft-glow)"/>
      <circle cx="96" cy="0" r="4.5" fill="#00FFA3" filter="url(#hyper-glow)"/>
      <circle cx="-96" cy="0" r="3.5" fill="#00F0FF" filter="url(#soft-glow)"/>
    </g>

    <g class="anim-orbit2">
      <ellipse rx="82" ry="30" transform="rotate(60)" fill="none" stroke="url(#neon-cyan-purple)" stroke-width="1.8" stroke-dasharray="5 7" stroke-opacity="0.75" filter="url(#soft-glow)"/>
      <circle cx="0" cy="30" r="4" fill="#FF007F" filter="url(#hyper-glow)"/>
    </g>

    <g class="anim-orbit3">
      <ellipse rx="70" ry="26" transform="rotate(-60)" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.65"/>
      <circle cx="0" cy="-26" r="3.5" fill="#FFFFFF" filter="url(#hyper-glow)"/>
    </g>

    <!-- Floating Hexagonal Energy Grid -->
    <polygon points="0,-48 41,-24 41,24 0,48 -41,24 -41,-24" fill="#0A0E24" fill-opacity="0.6" stroke="#7000FF" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Pulsing Quantum Singularity Core -->
    <circle r="36" fill="url(#quantum-core)" class="anim-core" filter="url(#hyper-glow)"/>
    <circle r="18" fill="#04060E" stroke="#00F0FF" stroke-width="2" filter="url(#soft-glow)"/>

    <!-- Core Icon Symbol: Antigravity Floating Crown / Delta Triangle -->
    <path d="M 0 -8 L 7 5 L -7 5 Z" fill="url(#neon-cyan-purple)" filter="url(#soft-glow)"/>
    <circle cx="0" cy="-11" r="2" fill="#FFFFFF" filter="url(#hyper-glow)"/>

    <!-- Orbiting Code Satellites -->
    <g filter="url(#soft-glow)" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">
      <g transform="translate(-85, -60)">
        <rect width="48" height="18" rx="4" fill="#0B132B" stroke="#00F0FF" stroke-opacity="0.6"/>
        <text x="6" y="13" fill="#00F0FF">&lt;JSX/&gt;</text>
      </g>
      <g transform="translate(50, -75)">
        <rect width="42" height="18" rx="4" fill="#140D2B" stroke="#A855F7" stroke-opacity="0.6"/>
        <text x="6" y="13" fill="#C084FC">CSS3</text>
      </g>
      <g transform="translate(60, 58)">
        <rect width="48" height="18" rx="4" fill="#1F0D24" stroke="#FF007F" stroke-opacity="0.6"/>
        <text x="6" y="13" fill="#FF007F">WebGL</text>
      </g>
      <g transform="translate(-95, 50)">
        <rect width="52" height="18" rx="4" fill="#061B1B" stroke="#00FFA3" stroke-opacity="0.6"/>
        <text x="6" y="13" fill="#00FFA3">AI-OPS</text>
      </g>
    </g>

  </g>

</svg>
